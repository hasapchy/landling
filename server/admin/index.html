<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HasApp — Заявки</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#F4F7FC; color:#0B1220; }

  header {
    background:linear-gradient(90deg,#102D65,#1B4BB1);
    padding:24px 32px;
    color:#fff;
  }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; color:rgba(255,255,255,0.75); }

  /* Стили для кнопки "Выйти" */
  .btn-logout {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 16px;
    border-radius: 999px;
    text-decoration: none; /* Убирает подчеркивание */
    transition: all 0.2s ease-in-out; /* Плавное наведение */
  }

  .btn-logout:hover {
    background: rgba(255, 255, 255, 0.15); /* Мягкая заливка фона */
    border-color: rgba(255, 255, 255, 0.8); /* Более яркая рамка */
    text-decoration: none; /* Гарантирует отсутствие подчеркивания */
  }

  main {
    max-width:1600px;
    margin:32px auto;
    padding:0 24px 48px;
  }

  .count {
    font-size:13px;
    color:#8A94A6;
    margin-bottom:16px;
  }

  table {
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(5,76,134,0.08);
  }
  th, td {
    text-align:left;
    padding:16px 20px;
    font-size:14px;
    border-bottom:1px solid #EEF2F8;
    vertical-align:top;
  }
  th {
    background:#F4F7FC;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.4px;
    color:#8A94A6;
    white-space:nowrap;
  }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#FAFCFF; }

  /* Ссылки внутри таблицы/карточек */
  a { color:#1B4BB1; text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }

  .empty {
    text-align:center;
    padding:64px;
    color:#8A94A6;
    background:#fff;
    border-radius:16px;
    box-shadow:0 8px 24px rgba(5,76,134,0.08);
  }
  .date { color:#8A94A6; font-size:12px; white-space:nowrap; }
  .msg { max-width:420px; line-height:1.5; }

  /* карточки на мобильных вместо таблицы */
  .cards { display:none; flex-direction:column; gap:12px; }
  .card {
    background:#fff;
    border-radius:16px;
    padding:18px 20px;
    box-shadow:0 8px 24px rgba(5,76,134,0.08);
  }
  .card-row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #EEF2F8; }
  .card-row:last-child { border-bottom:none; }
  .card-label { font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:#8A94A6; flex-shrink:0; }
  .card-value { font-size:14px; text-align:right; word-break:break-word; }
  .card-name { font-size:16px; font-weight:700; margin-bottom:10px; color:#0B1220; }

  @media (max-width: 800px) {
    header { padding:20px; }
    main { padding:0 16px 40px; margin-top:20px; }
    table { display:none; }
    .cards { display:flex; }
  }
</style>
</head>
<body>
    <header style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
        <div>
          <h1>Заявки с сайта HasApp</h1>
          <p>Все обращения через контактную форму</p>
        </div>
        <!-- Кнопка с новым классом -->
        <a href="/admin/logout" class="btn-logout">Выйти</a>
      </header>
  <main>
    <div id="count" class="count"></div>

    <table id="table" style="display:none;">
      <thead>
        <tr><th>Дата</th><th>Имя</th><th>Телефон</th><th>Email</th><th>Сообщение</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="cards" class="cards"></div>

    <div id="empty" class="empty">Загрузка...</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
